# A local stand-in for one catalog runtime namespace, for kind: the operator's
# pod labels, a ServiceAccount per component, no POD_NAMESPACE or POD_NAME,
# and a token mounted only in the booth. The dev server stands in for Temporal
# Cloud. RBAC comes from grant-crash-rbac.sh, as in the catalog.
apiVersion: v1
kind: Namespace
metadata:
  name: fieldkit-podpocalypse-abcde
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: booth, namespace: fieldkit-podpocalypse-abcde}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sessions, namespace: fieldkit-podpocalypse-abcde}
---
apiVersion: v1
kind: Service
metadata: {name: temporal-dev, namespace: fieldkit-podpocalypse-abcde}
spec:
  selector: {app: temporal-dev}
  ports: [{name: grpc, port: 7233, targetPort: 7233}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: temporal-dev, namespace: fieldkit-podpocalypse-abcde}
spec:
  replicas: 1
  selector: {matchLabels: {app: temporal-dev}}
  template:
    metadata: {labels: {app: temporal-dev}}
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:1.5.1
          imagePullPolicy: IfNotPresent
          args: [server, start-dev, --ip, 0.0.0.0, --port, "7233", --ui-port, "8233"]
          readinessProbe: {tcpSocket: {port: 7233}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: booth, namespace: fieldkit-podpocalypse-abcde}
spec:
  selector: {app.kubernetes.io/name: podpocalypse, app.kubernetes.io/component: booth}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: booth, namespace: fieldkit-podpocalypse-abcde}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: podpocalypse, app.kubernetes.io/component: booth}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: podpocalypse, app.kubernetes.io/component: booth, platform.temporal.io/project: podpocalypse}
    spec:
      serviceAccountName: booth
      automountServiceAccountToken: true
      containers:
        - name: booth
          image: podpocalypse:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: RUNTIME, value: pod}
            - {name: PUBLIC_URL, value: "http://localhost:18090"}
            - {name: CONTROL_TASK_QUEUE, value: podpocalypse-control}
            - {name: TEMPORAL_ADDRESS, value: "temporal-dev:7233"}
            - {name: TEMPORAL_NAMESPACE, value: default}
            - {name: GAME_DURATION, value: 40s}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sessions, namespace: fieldkit-podpocalypse-abcde}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: podpocalypse, app.kubernetes.io/component: sessions}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: podpocalypse, app.kubernetes.io/component: sessions, platform.temporal.io/project: podpocalypse}
    spec:
      serviceAccountName: sessions
      automountServiceAccountToken: false
      containers:
        - name: sessions
          image: podpocalypse:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: session}
            - {name: TASK_QUEUE, value: podpocalypse-sessions}
            - {name: TEMPORAL_ADDRESS, value: "temporal-dev:7233"}
            - {name: TEMPORAL_NAMESPACE, value: default}
