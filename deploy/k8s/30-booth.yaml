apiVersion: v1
kind: Service
metadata:
  name: booth
  namespace: podpocalypse
spec:
  type: NodePort
  selector:
    app: booth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booth
  namespace: podpocalypse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booth
  template:
    metadata:
      labels:
        app: booth
    spec:
      serviceAccountName: booth
      containers:
        - name: booth
          image: podpocalypse:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ROLE
              value: booth
            - name: HTTP_ADDR
              value: ":8080"
            - name: RUNTIME
              value: kubernetes
            - name: TEMPORAL_ADDRESS
              value: temporal-dev:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: SESSION_IMAGE
              value: podpocalypse:dev
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEAD_PATH
              value: /data/leads.jsonl
            - name: RECOVERY_DELAY
              value: 4s
            - name: GAME_DURATION
              value: 60s
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: leads
              mountPath: /data
      volumes:
        - name: leads
          emptyDir: {}
