apiVersion: v1
kind: Service
metadata:
  name: temporal-dev
  namespace: podpocalypse
spec:
  selector:
    app: temporal-dev
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: ui
      port: 8233
      targetPort: 8233
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: podpocalypse
spec:
  type: NodePort
  selector:
    app: temporal-dev
  ports:
    - name: ui
      port: 8233
      targetPort: 8233
      nodePort: 30083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-dev
  namespace: podpocalypse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-dev
  template:
    metadata:
      labels:
        app: temporal-dev
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:1.5.1
          imagePullPolicy: IfNotPresent
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --port
            - "7233"
            - --ui-port
            - "8233"
            - --db-filename
            - /data/temporal.db
          ports:
            - containerPort: 7233
            - containerPort: 8233
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
